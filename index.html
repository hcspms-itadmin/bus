<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>滿東邨 巴士實時到站時間屏</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #ffcc00;
            margin-bottom: 5px;
            font-size: 24px;
        }
        .update-time {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .bus-card {
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border-left: 5px solid #ffcc00;
        }
        .bus-card.nlb {
            border-left: 5px solid #0099ff;
        }
        .bus-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }
        .route-num {
            font-size: 24px;
            font-weight: bold;
            color: #ffcc00;
        }
        .nlb .route-num {
            color: #0099ff;
        }
        .route-dest {
            font-size: 16px;
            color: #bbb;
        }
        .eta-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .eta-item {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
        }
        .eta-seq {
            color: #888;
        }
        .eta-time {
            font-weight: bold;
            color: #00ff66;
        }
        .eta-countdown {
            background-color: #2a2a2a;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 14px;
            color: #fff;
        }
        .loading {
            text-align: center;
            color: #aaa;
            font-size: 18px;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>東涌滿東邨 - 巴士到站預報</h1>
        <div id="update-time" class="update-time">正在初始化...</div>
        <div id="bus-board">
            <div class="loading">正在實時連線獲取數據...</div>
        </div>
    </div>

    <script>
        var CTB_ROUTES = ["E11B", "E21A", "E22S", "S52"];
        var NLB_ROUTES = ["37M", "39M", "B6"];

        function getMinutesDiff(etaTimeString) {
            if (!etaTimeString) return "無班次";
            var now = new Date();
            var etaTime = new Date(etaTimeString);
            var diffMs = etaTime - now;
            var diffMins = Math.ceil(diffMs / 1000 / 60);
            if (diffMins <= 0) return "即將抵站";
            return diffMins + " 分鐘";
        }

        function formatLocalTime(etaTimeString) {
            if (!etaTimeString) return "--:--";
            var date = new Date(etaTimeString);
            return date.toTimeString().substring(0, 5);
        }

        async function fetchETA() {
            var combinedData = [];

            // --- 1. 抓取城巴數據 (一條過寫死正確完整 URL，內含 rt.) ---
            try {
                var ctbResponse = await fetch("https://data.gov.hk");
                var ctbJson = await ctbResponse.json();
                
                if (ctbJson && ctbJson.data) {
                    CTB_ROUTES.forEach(function(route) {
                        var etas = ctbJson.data
                            .filter(function(item) { return item.route === route; })
                            .sort(function(a, b) { return a.eta_seq - b.eta_seq; })
                            .slice(0, 3);
                        
                        if (etas.length > 0) {
                            combinedData.push({
                                company: 'CTB',
                                route: route,
                                dest: etas[0].dest_tc || "未知目的地",
                                schedule: etas.map(function(e) { return { eta: e.eta }; })
                            });
                        }
                    });
                }
            } catch (e) {
                console.error("獲取城巴 API 失敗:", e);
            }

            // --- 2. 抓取新大嶼山巴士數據 (一條過寫死正確完整 URL，內含 rt.) ---
            try {
                var nlbResponse = await fetch("https://data.gov.hk");
                var nlbJson = await nlbResponse.json();
                
                if (nlbJson && nlbJson.estimatedArrivals) {
                    NLB_ROUTES.forEach(function(route) {
                        var etas = nlbJson.estimatedArrivals
                            .filter(function(item) { return item.routeNo === route; })
                            .sort(function(a, b) { return a.arrivalTimeSequence - b.arrivalTimeSequence; })
                            .slice(0, 3);

                        if (etas.length > 0) {
                            combinedData.push({
                                company: 'NLB',
                                route: route,
                                dest: etas[0].destinationCH || "未知目的地",
                                schedule: etas.map(function(e) { return { eta: e.arrivalTime }; })
                            });
                        }
                    });
                }
            } catch (e) {
                console.error("獲取新大嶼山巴士 API 失敗:", e);
            }

            renderBoard(combinedData);
        }

        function renderBoard(data) {
            var boardHtml = "";
            if (data.length === 0) {
                document.getElementById('bus-board').innerHTML = "<div class='loading'>暫時未能獲取任何巴士到站數據。</div>";
                return;
            }

            data.forEach(function(item) {
                var isNlb = item.company === 'NLB';
                boardHtml += '<div class="bus-card ' + (isNlb ? 'nlb' : '') + '">' +
                                '<div class="bus-header">' +
                                    '<span class="route-num">' + item.route + '</span>' +
                                    '<span class="route-dest">往 ' + item.dest + '</span>' +
                                '</div>' +
                                '<div class="eta-list">';

                item.schedule.forEach(function(sched, index) {
                    var minutesLeft = getMinutesDiff(sched.eta);
                    var clockTime = formatLocalTime(sched.eta);
                    boardHtml += '<div class="eta-item">' +
                                    '<span class="eta-seq">班次 ' + (index + 1) + '</span>' +
                                    '<div>' +
                                        '<span class="eta-time">' + clockTime + '</span> ' +
                                        '<span class="eta-countdown">' + minutesLeft + '</span>' +
                                    '</div>' +
                                '</div>';
                });

                boardHtml += '</div></div>';
            });

            document.getElementById('bus-board').innerHTML = boardHtml;
            document.getElementById('update-time').innerText = "最後更新時間: " + new Date().toLocaleTimeString();
        }

        fetchETA();
        setInterval(fetchETA, 30000);
    </script>
</body>
</html>
